# SecureBank Labs — application configuration
#
# WARNING: this application is INTENTIONALLY VULNERABLE. It exists to be
# exploited and then fixed. Do not deploy it anywhere reachable.

spring:
  application:
    name: securebank-labs

  datasource:
    url: jdbc:postgresql://localhost:5432/securebank
    username: securebank
    password: securebank
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # schema.sql owns the schema; Hibernate only validates it. This fails
      # fast and loudly if the two ever disagree.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      # schema.sql + data.sql run on every boot, idempotently. This is what
      # makes the seed self-healing after you wreck the database mid-lab.
      mode: always
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    # LAB 4 (A02) + LAB 23 (A10): verbose errors.
    # These are deliberately weakened. Lab 23's fix is to set them to `never`
    # and add input validation; Lab 4's fix additionally stops the exception
    # message from embedding the JWT secret and the JDBC URL.
    include-stacktrace: never
    include-message: never
    include-exception: never
    include-binding-errors: never
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: always
  server:
    base-path: /actuator

logging:
  level:
    com.securebank: INFO
    org.springframework.jdbc.core: WARN
