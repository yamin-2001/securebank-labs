# SecureBank Labs — application configuration
#
# This is the FIXED build: every lab has been patched. The vulnerable build
# lives on the `main` branch.

spring:
  application:
    name: securebank-labs

  datasource:
    url: jdbc:postgresql://localhost:5432/securebank
    username: securebank
    password: securebank
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # schema.sql owns the schema; Hibernate only validates it. This fails
      # fast and loudly if the two ever disagree.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      # schema.sql + data.sql run on every boot, idempotently. This is what
      # makes the seed self-healing after you wreck the database mid-lab.
      mode: always
      encoding: UTF-8

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

server:
  port: 8080
  error:
    # LAB 4 (A02) + LAB 23 (A10): verbose errors.
    # FIXED: the error pages carry no internals. A stack trace, the
    # exception type or the message can all name the framework version, the
    # application's class names and — when the message embeds them — the
    # JWT secret and the database credentials.
    include-stacktrace: never
    include-message: never
    include-exception: never
    include-binding-errors: never
    include-path: never

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    env:
      show-values: always
  server:
    base-path: /actuator

logging:
  level:
    com.securebank: INFO
    org.springframework.jdbc.core: WARN
